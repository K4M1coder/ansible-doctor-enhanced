repos:
  - repo: local
    hooks:
      # ========================================
      # GROUPE 1: Formatage basique (rapide)
      # ========================================
      - id: trailing-whitespace
        name: Remove trailing whitespace
        entry: bash -c 'exit 0' # placeholder - pre-commit's builtin used via local
        language: system
        files: '\.py$|\.md$|\.toml$|\.yaml$'

      - id: end-of-file-fixer
        name: Ensure file ends with a newline
        entry: bash -c 'exit 0'
        language: system
        files: '\.py$|\.md$|\.toml$|\.yaml$'

      - id: check-yaml
        name: Validate YAML
        entry: python scripts/check_yaml.py
        language: python
        additional_dependencies: ["pyyaml>=6.0"]
        files: '\.ya?ml$'
        exclude: 'tests/fixtures/|specs/.*/contracts/.*\.yaml$'

      # ========================================
      # GROUPE 2: Formatage code Python
      # ========================================
      - id: black
        name: Format Python code with Black
        entry: black
        language: python
        additional_dependencies: ["black==24.4.0"]
        files: '\.py$'

      - id: isort
        name: Sort Python imports with isort
        entry: isort
        language: python
        additional_dependencies: ["isort==5.13.0"]
        files: '\.py$'

      # ========================================
      # GROUPE 3: Linting Python
      # ========================================
      - id: ruff
        name: Lint with ruff (auto-fix)
        entry: ruff check --fix
        language: python
        additional_dependencies: ["ruff>=0.1.0"]
        files: '\.py$'

      # ========================================
      # GROUPE 4: Type checking
      # ========================================
      - id: mypy
        name: Type checking with mypy
        entry: mypy
        language: python
        additional_dependencies: [
          "mypy>=1.8.0",
          "types-requests",
          "click>=8.1.0",
          "jinja2>=3.1.0",
          "pydantic>=2.0.0",
          "ruamel.yaml>=0.18.0",
          "structlog>=24.0.0",
          "watchdog>=4.0.0",
          "packaging>=24.0",
          "pyyaml>=6.0",
          "babel>=2.14.0",
          "pathspec>=0.12.0",
          "types-pyyaml",
        ]
        files: '^ansibledoctor/.*\.py$'
        exclude: '^(tests|scripts|demo)/'
        pass_filenames: true
        args: ["--config-file=pyproject.toml", "--no-error-summary"]

      # ========================================
      # GROUPE 5: Documentation & Version
      # ========================================
      - id: sync-version
        name: Sync version from pyproject to CHANGELOG and READMEs
        entry: python scripts/sync_version.py --stage 1
        language: python
        additional_dependencies: ["tomli"]
        files: ^(pyproject\.toml|CHANGELOG\.md|README.*)$
        pass_filenames: false
        stages: [pre-commit]

      - id: update-readme-toc
        name: Update README Table of Contents
        entry: python scripts/update_readme_toc.py
        language: python
        additional_dependencies: ["md-toc>=9.0.0"]
        files: ^README\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-atomic-changelog
        name: Validate atomic changelog and README
        entry: python scripts/validate_atomic_changelog.py --base origin/main --head HEAD
        language: python
        additional_dependencies: ["tomli"]
        files: ^(pyproject.toml|CHANGELOG\.md|README.*)$
        types: [text, toml]
        always_run: false
        pass_filenames: false

      # ========================================
      # GROUPE 6: Tests (du plus rapide au plus lent)
      # ========================================
      - id: pytest-unit
        name: Run unit tests
        entry: python scripts/run_pytest_precommit.py
        language: python
        additional_dependencies: [
          "pytest>=8.0.0",
          "pytest-cov>=4.0.0",
          "pytest-mock",
          "pytest-cov>=4.0.0",
          "click",
          "jinja2",
          "pydantic",
          "ruamel.yaml",
          "structlog",
          "watchdog",
          "packaging",
          "pyyaml",
          "babel",
          "pathspec",
        ]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-integration
        name: Run integration tests
        entry: python scripts/run_pytest_precommit.py tests/integration -q
        language: python
        additional_dependencies: [
          "pytest>=8.0.0",
          "pytest-cov>=4.0.0",
          "click",
          "jinja2",
          "pydantic",
          "ruamel.yaml",
          "structlog",
          "watchdog",
          "packaging",
          "pyyaml",
          "babel",
          "pathspec",
        ]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: pytest-performance
        name: Run performance tests
        entry: python scripts/run_pytest_precommit.py tests/performance -q
        language: python
        additional_dependencies: [
          "pytest>=8.0.0",
          "pytest-cov>=4.0.0",
          "click",
          "jinja2",
          "pydantic",
          "ruamel.yaml",
          "structlog",
          "watchdog",
          "packaging",
          "pyyaml",
          "babel",
          "pathspec",
        ]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: pytest-all
        name: Run full test suite (pre-push)
        entry: python scripts/run_pytest_precommit.py -q
        language: python
        additional_dependencies: [
          "pytest>=8.0.0",
          "click",
          "jinja2",
          "pydantic",
          "ruamel.yaml",
          "structlog",
          "watchdog",
          "packaging",
          "pyyaml",
          "babel",
          "pathspec",
        ]
        pass_filenames: false
        stages: [pre-push]

      - id: demo-run
        name: Run demo projects (non-fatal)
        entry: python scripts/run_demo_in_precommit.py
        language: python
        additional_dependencies: [
          "click",
          "jinja2",
          "pydantic",
          "ruamel.yaml",
          "structlog",
          "watchdog",
          "packaging",
          "pyyaml",
          "babel",
          "pathspec",
          "docutils",
          "html5lib",
        ]
        pass_filenames: false
        stages: [pre-commit, pre-push]
