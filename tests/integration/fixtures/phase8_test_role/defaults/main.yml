---
# @var phase8_service_name:description: Name of the service to manage
# @var phase8_service_name:type: string
# @var phase8_service_name:example: "my-app"
# @var phase8_service_name:required: true
phase8_service_name: "test-service"

# @var phase8_port:description: Port number for the service
# @var phase8_port:type: number
# @var phase8_port:example: 8080
phase8_port: 8080

# @var phase8_enabled:description: Whether the service is enabled
# @var phase8_enabled:type: boolean
phase8_enabled: true

