[tool.poetry]
name = "ansible-doctor-enhanced"
version = "0.5.1"
description = "Enhanced Ansible role documentation generator with annotation support, logging, error handling, and reporting"
authors = ["Cédric Thédrez <kamicth@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/ansible-doctor-enhanced"
repository = "https://github.com/yourusername/ansible-doctor-enhanced"
keywords = ["ansible", "documentation", "parser", "roles", "annotations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "ansibledoctor"}]

[tool.poetry.dependencies]
python = "^3.11"
ruamel-yaml = "^0.18.0"
pydantic = "^2.0"
click = "^8.1.0"
structlog = "^24.0.0"
pathspec = "^0.12.0"
jinja2 = "^3.1.0"
watchdog = "^6.0.0"
packaging = "^24.0"
pyyaml = "^6.0.3"
babel = "^2.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.92.0"
mypy = "^1.8.0"
black = "^24.0.0"
isort = "^5.13.0"
ruff = "^0.1.0"
ansible-core = ">=2.14,<2.18"
html5lib = "^1.1"
docutils = "^0.20"
pre-commit = "^3.4.0"
ghapi = "^1.0.8"
tomli = "^2.0"

[tool.poetry.scripts]
ansible-doctor-enhanced = "ansibledoctor.cli:main"
ansibledoctor = "ansibledoctor.cli:main"

## Note: the old `[tool.poetry.dev-dependencies]` is deprecated; dev dependencies are
## declared in the `[tool.poetry.group.dev.dependencies]` section above. The tomli
## package was moved into the new dev group and thus the deprecated section is removed.

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=ansibledoctor --cov-report=term-missing --cov-report=html --ignore=tests/fixtures"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["ansibledoctor"]
omit = ["*/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
