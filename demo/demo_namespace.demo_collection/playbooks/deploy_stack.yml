---
# Deploy a complete web application stack with database
#
# This playbook demonstrates the use of all three roles in the collection
# with proper dependency chaining: database -> application -> webserver
#
# Usage:
#   ansible-playbook -i inventory deploy_stack.yml

- name: Deploy complete web application stack
  hosts: webservers
  become: true
  
  vars:
    # Database configuration
    db_postgres_version: "14"
    db_postgres_port: 5432
    db_postgres_max_connections: 200
    db_database_name: "webapp_prod"
    db_database_user: "webapp_user"
    db_database_password: "{{ vault_db_password }}"
    
    # Application configuration
    app_name: "mywebapp"
    app_user: "webapp"
    app_home: "/opt/mywebapp"
    app_python_version: "3.9"
    app_git_repo: "https://github.com/example/webapp.git"
    app_git_version: "main"
    app_environment: "production"
    app_port: 8000
    
    # Webserver configuration
    webserver_nginx_version: "latest"
    webserver_server_name: "example.com www.example.com"
    webserver_upstream_host: "127.0.0.1"
    webserver_upstream_port: 8000
    webserver_ssl_enabled: true
    webserver_ssl_certificate: "/etc/ssl/certs/example.com.crt"
    webserver_ssl_certificate_key: "/etc/ssl/private/example.com.key"

  roles:
    # Roles are automatically executed in dependency order:
    # 1. database (no dependencies)
    # 2. application (depends on database)
    # 3. webserver (depends on application)
    - demo_namespace.demo_collection.database
    - demo_namespace.demo_collection.application
    - demo_namespace.demo_collection.webserver

  post_tasks:
    - name: Check SSL certificate expiration
      demo_namespace.demo_collection.ssl_cert_info:
        path: "{{ webserver_ssl_certificate }}"
      register: cert_info
      
    - name: Display certificate information
      debug:
        msg: |
          Certificate expires: {{ cert_info.expiry_date }}
          Days remaining: {{ cert_info.days_remaining }}
      
    - name: Validate Nginx configuration
      demo_namespace.demo_collection.nginx_config_test:
        config_file: "{{ webserver_config_path }}"
      register: nginx_test
      
    - name: Display Nginx test results
      debug:
        msg: "Nginx configuration is {{ 'valid' if nginx_test.valid else 'invalid' }}"
    
    - name: Perform application health check
      demo_namespace.demo_collection.health_check:
        url: "https://{{ webserver_server_name.split()[0] }}/health"
        timeout: 10
        expected_status: 200
      register: health
      
    - name: Display health check results
      debug:
        msg: |
          Health check: {{ 'PASSED' if health.healthy else 'FAILED' }}
          Response time: {{ health.response_time | format_uptime }}
