---
# Application deployment playbook
#
# Deploys a new version of the application with automated rollback
# capability and health checks.
#
# Usage:
#   ansible-playbook -i inventory app_deployment.yml -e "app_version=v1.2.3"

- name: Deploy application update
  hosts: app_servers
  become: true
  
  vars:
    app_name: "mywebapp"
    app_home: "/opt/mywebapp"
    app_user: "webapp"
    app_version: "{{ app_version | default('main') }}"
    app_git_repo: "https://github.com/example/webapp.git"
    app_service_name: "mywebapp"
    health_check_url: "http://localhost:8000/health"
    rollback_on_failure: true
    
  tasks:
    - name: Get current deployed version
      command: cat {{ app_home }}/VERSION
      register: current_version
      ignore_errors: true
      changed_when: false
      
    - name: Display deployment information
      debug:
        msg: |
          Current version: {{ current_version.stdout | default('unknown') }}
          Target version: {{ app_version }}
    
    - name: Deploy application
      demo_namespace.demo_collection.app_deploy:
        name: "{{ app_name }}"
        path: "{{ app_home }}"
        user: "{{ app_user }}"
        git_repo: "{{ app_git_repo }}"
        version: "{{ app_version }}"
        service_name: "{{ app_service_name }}"
        rollback_on_failure: "{{ rollback_on_failure }}"
      register: deploy_result
      
    - name: Display deployment results
      debug:
        msg: |
          Deployment status: {{ deploy_result.status }}
          Version: {{ deploy_result.version }}
          Path: {{ deploy_result.path }}
          {% if deploy_result.changed %}
          Changes detected: Application updated
          {% else %}
          No changes: Already at target version
          {% endif %}
    
    - name: Wait for application to start
      wait_for:
        host: localhost
        port: 8000
        delay: 5
        timeout: 60
        state: started
      when: deploy_result.changed
      
    - name: Perform health check
      demo_namespace.demo_collection.health_check:
        url: "{{ health_check_url }}"
        timeout: 10
        expected_status: 200
      register: health
      retries: 3
      delay: 5
      until: health.healthy
      
    - name: Display health check results
      debug:
        msg: |
          Health check: {{ 'PASSED ✓' if health.healthy else 'FAILED ✗' }}
          Status code: {{ health.status_code }}
          Response time: {{ health.response_time }}ms
    
    - name: Update deployment metadata
      copy:
        content: |
          version={{ app_version }}
          deployed_at={{ ansible_date_time.iso8601 }}
          deployed_by={{ ansible_user_id }}
          hostname={{ ansible_hostname }}
        dest: "{{ app_home }}/VERSION"
        owner: "{{ app_user }}"
        mode: '0644'
      when: health.healthy
      
    - name: Rollback on failure
      block:
        - name: Perform rollback
          demo_namespace.demo_collection.app_deploy:
            name: "{{ app_name }}"
            path: "{{ app_home }}"
            user: "{{ app_user }}"
            git_repo: "{{ app_git_repo }}"
            version: "{{ current_version.stdout }}"
            service_name: "{{ app_service_name }}"
            rollback_on_failure: false
          when: 
            - not health.healthy
            - rollback_on_failure
            - current_version.stdout is defined
            
        - name: Display rollback information
          debug:
            msg: "Rolled back to version: {{ current_version.stdout }}"
          when:
            - not health.healthy
            - rollback_on_failure
      when: not health.healthy

  post_tasks:
    - name: Send deployment notification
      debug:
        msg: |
          ================================================
          Deployment Summary
          ================================================
          Application: {{ app_name }}
          Version: {{ app_version }}
          Status: {{ 'SUCCESS ✓' if health.healthy else 'FAILED ✗' }}
          Deployed at: {{ ansible_date_time.iso8601 }}
          ================================================
