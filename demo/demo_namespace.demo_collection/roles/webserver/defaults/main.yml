---
# Webserver Role - Default Variables
# @meta author: Demo Author
# @meta description: Variables for Nginx webserver configuration

# @var nginx_port:description: HTTP port for Nginx
nginx_port: 80

# @var nginx_ssl_port:description: HTTPS port for Nginx
nginx_ssl_port: 443

# @var nginx_server_name:description: Server name for virtual host
nginx_server_name: "example.com"

# @var nginx_ssl_enabled:description: Enable SSL/TLS
nginx_ssl_enabled: true

# @var nginx_ssl_cert:description: Path to SSL certificate
nginx_ssl_cert: "/etc/ssl/certs/ssl-cert-snakeoil.pem"

# @var nginx_ssl_key:description: Path to SSL private key
nginx_ssl_key: "/etc/ssl/private/ssl-cert-snakeoil.key"

# @var nginx_proxy_pass:description: Backend application URL
nginx_proxy_pass: "http://127.0.0.1:{{ app_port }}"

# @var nginx_client_max_body_size:description: Maximum request body size
nginx_client_max_body_size: "10M"

# @var nginx_worker_processes:description: Number of worker processes
nginx_worker_processes: "auto"

# @var nginx_worker_connections:description: Worker connections limit
nginx_worker_connections: 1024
