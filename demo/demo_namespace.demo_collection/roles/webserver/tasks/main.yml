---
# Webserver Role - Main Tasks
# @meta description: Install and configure Nginx as reverse proxy

# @task Install Nginx
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  tags:
    - webserver
    - install

# @task Configure Nginx main config
- name: Configure Nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx
  tags:
    - webserver
    - configure

# @task Configure virtual host
- name: Configure virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_server_name }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx
  tags:
    - webserver
    - configure

# @task Enable virtual host
- name: Enable virtual host
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_server_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_server_name }}"
    state: link
  notify: Reload Nginx
  tags:
    - webserver
    - configure

# @task Ensure Nginx is started
- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  tags:
    - webserver
    - service
