---
# Application Role - Default Variables
# @meta author: Demo Author
# @meta description: Variables for web application deployment

# @var app_name:description: Application name
app_name: "demo_app"

# @var app_version:description: Application version to deploy
app_version: "1.0.0"

# @var app_user:description: System user for running the application
app_user: "appuser"

# @var app_dir:description: Application installation directory
app_dir: "/opt/{{ app_name }}"

# @var app_port:description: Application server port
app_port: 8000

# @var app_env:description: Application environment (development, production)
# @var app_env:example: production
app_env: "production"

# @var app_database_name:description: Database name for the application
app_database_name: "{{ app_name }}_db"

# @var app_secret_key:description: Application secret key
# @var app_secret_key:example: "change-me-in-production"
app_secret_key: "CHANGE_ME"

# @var app_debug:description: Enable debug mode
app_debug: false

# @var app_allowed_hosts:description: List of allowed hosts
# @var app_allowed_hosts:type: list
app_allowed_hosts:
  - localhost
  - 127.0.0.1
