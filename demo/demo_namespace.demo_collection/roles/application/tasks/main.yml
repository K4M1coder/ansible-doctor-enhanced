---
# Application Role - Main Tasks
# @meta description: Deploy and configure web application

# @task Create application user
- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    create_home: false
    shell: /bin/false
  tags:
    - application
    - setup

# @task Create application directory
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
  tags:
    - application
    - setup

# @task Install Python dependencies
- name: Install Python packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  tags:
    - application
    - install

# @task Create application database
# @task description: Create PostgreSQL database for the application
- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ app_database_name }}"
    state: present
  become: true
  become_user: postgres
  tags:
    - application
    - database

# @task Deploy application
- name: Deploy application files
  ansible.builtin.copy:
    src: "app-{{ app_version }}.tar.gz"
    dest: "{{ app_dir }}/app.tar.gz"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
  tags:
    - application
    - deploy

# @task Configure application
- name: Configure application
  ansible.builtin.template:
    src: settings.py.j2
    dest: "{{ app_dir }}/settings.py"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0640'
  notify: Restart application
  tags:
    - application
    - configure
