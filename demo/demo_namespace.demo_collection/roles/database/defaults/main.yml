---
# Database Role - Default Variables
# @meta author: Demo Author
# @meta description: Variables for PostgreSQL database configuration

# @var postgresql_version:description: PostgreSQL version to install
# @var postgresql_version:type: string
postgresql_version: "14"

# @var postgresql_port:description: Port for PostgreSQL server
# @var postgresql_port:type: int
postgresql_port: 5432

# @var postgresql_data_dir:description: Data directory path
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"

# @var postgresql_config_dir:description: Configuration directory path
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"

# @var postgresql_listen_addresses:description: Addresses to listen on
# @var postgresql_listen_addresses:type: list
postgresql_listen_addresses:
  - localhost

# @var postgresql_max_connections:description: Maximum number of connections
postgresql_max_connections: 100

# @var postgresql_shared_buffers:description: Shared buffer size
postgresql_shared_buffers: "128MB"

# @var postgresql_backup_enabled:description: Enable automated backups
postgresql_backup_enabled: true

# @var postgresql_backup_dir:description: Backup directory path
postgresql_backup_dir: "/var/backups/postgresql"
