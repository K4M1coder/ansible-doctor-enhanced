# ansible-doctor configuration file
# This will be used by Feature 003 once implemented

# Output format: markdown, html, or rst
output_format: html

# Output file path
output: docs/nginx-role.html

# Use custom template (optional)
# template: custom-template.j2

# Enable recursive role discovery
recursive: false

# Exclude patterns (glob format)
exclude_patterns:
  - "*.pyc"
  - "__pycache__"
  - ".git"
  - "test_*"
