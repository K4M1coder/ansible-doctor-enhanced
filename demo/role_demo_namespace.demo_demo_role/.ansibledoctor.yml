# ansible-doctor-enhanced configuration file
# This demonstrates config file discovery (will be found by parent directory search)

# Output configuration
output_format: markdown
output: README-generated.md

# Custom template support (optional)
# template: custom-template.j2
# template_dir: templates/

# Recursive role discovery (for collections)
recursive: false

# Output directory for batch generation
# output_dir: docs/

# Exclude patterns (glob syntax)
exclude_patterns:
  - "*.pyc"
  - "__pycache__"
  - ".git"
  - "*.retry"
  - ".venv"
  - ".tox"
