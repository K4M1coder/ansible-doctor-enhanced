---
# Handlers for demo-role
# These handlers respond to notification events from tasks

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - handlers
    - systemd

- name: Restart application
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: restarted
  tags:
    - handlers
    - services

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  tags:
    - handlers
    - webserver

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  tags:
    - handlers
    - webserver

- name: Reload application config
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: reloaded
  when: "'reload' in ansible_service_mgr_features"
  tags:
    - handlers
    - services

- name: Clear application cache
  ansible.builtin.file:
    path: "{{ app_install_dir }}/cache"
    state: absent
  notify: Restart application
  tags:
    - handlers
    - maintenance
