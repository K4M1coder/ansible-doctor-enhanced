---
# Application Configuration Variables
# These variables control the core application behavior and deployment

# @var app_name:description: Name of the web application (used in configs, logs, and service names)
# @var app_name:type: string
# @var app_name:required: true
# @var app_name:example: "my-web-app"
app_name: "demo-app"

# @var app_port:description: TCP port number for the application HTTP server
# @var app_port:type: number
# @var app_port:example: 8080
app_port: 8000

# @var app_debug:description: Enable debug mode with verbose logging and hot-reload
# @var app_debug:type: boolean
# @var app_debug:example: false
app_debug: false

# @var app_workers:description: Number of worker processes for handling requests
# @var app_workers:type: number
# @var app_workers:example: 4
app_workers: 2

# Database Configuration
# @var db_host:description: PostgreSQL database server hostname or IP address
# @var db_host:type: string
# @var db_host:required: true
# @var db_host:example: "db.example.com"
db_host: "localhost"

# @var db_port:description: PostgreSQL server port number
# @var db_port:type: number
# @var db_port:example: 5432
db_port: 5432

# @var db_name:description: Database name for the application
# @var db_name:type: string
# @var db_name:required: true
# @var db_name:example: "myapp_production"
db_name: "{{ app_name }}_db"

# @var db_user:description: Database username for application connections
# @var db_user:type: string
# @var db_user:required: true
# @var db_user:example: "app_user"
db_user: "{{ app_name }}_user"

# @var db_password:description: Database password (use Ansible Vault in production!)
# @var db_password:type: string
# @var db_password:required: true
# @var db_password:example: "SecureP@ssw0rd123"
db_password: "changeme"

# Web Server Configuration
# @var web_ssl_enabled:description: Enable HTTPS/SSL for the web server
# @var web_ssl_enabled:type: boolean
# @var web_ssl_enabled:example: true
web_ssl_enabled: false

# @var web_ssl_cert:description: Path to SSL certificate file (required if ssl_enabled is true)
# @var web_ssl_cert:type: string
# @var web_ssl_cert:example: "/etc/ssl/certs/server.crt"
web_ssl_cert: ""

# @var web_ssl_key:description: Path to SSL private key file (required if ssl_enabled is true)
# @var web_ssl_key:type: string
# @var web_ssl_key:example: "/etc/ssl/private/server.key"
web_ssl_key: ""

# @var web_domain:description: Primary domain name for the application
# @var web_domain:type: string
# @var web_domain:example: "myapp.example.com"
web_domain: "localhost"

# Application Paths
# @var app_install_dir:description: Installation directory for application files
# @var app_install_dir:type: string
# @var app_install_dir:example: "/opt/myapp"
app_install_dir: "/opt/{{ app_name }}"

# @var app_config_dir:description: Directory for application configuration files
# @var app_config_dir:type: string
# @var app_config_dir:example: "/etc/myapp"
app_config_dir: "/etc/{{ app_name }}"

# @var app_log_dir:description: Directory for application log files
# @var app_log_dir:type: string
# @var app_log_dir:example: "/var/log/myapp"
app_log_dir: "/var/log/{{ app_name }}"

# Deprecated Variables (for migration demonstration)
# @var old_app_path:description: Legacy application path (deprecated)
# @var old_app_path:deprecated: "Use app_install_dir instead. Will be removed in v2.0.0"
old_app_path: "/usr/local/{{ app_name }}"

# @example Basic development setup
# app_name: "dev-app"
# app_port: 3000
# app_debug: true
# app_workers: 1
# db_host: "localhost"
# db_name: "dev_database"
# web_ssl_enabled: false
# @end

# @example Production deployment with SSL
# app_name: "prod-api"
# app_port: 8443
# app_debug: false
# app_workers: 8
# db_host: "db-primary.internal.example.com"
# db_port: 5432
# db_name: "production_db"
# db_user: "prod_user"
# web_ssl_enabled: true
# web_ssl_cert: "/etc/ssl/certs/api.example.com.crt"
# web_ssl_key: "/etc/ssl/private/api.example.com.key"
# web_domain: "api.example.com"
# @end

# @example High-availability setup with replicas
# app_name: "ha-app"
# app_workers: 16
# db_host: "db-cluster.internal.example.com"
# db_replica_hosts:
#   - "db-replica1.internal.example.com"
#   - "db-replica2.internal.example.com"
# db_pool_size: 50
# web_ssl_enabled: true
# @end
