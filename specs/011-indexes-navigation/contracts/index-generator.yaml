openapi: 3.1.0
info:
  title: Index Generator API
  description: Protocol for generating index pages and sections for Ansible documentation
  version: 1.0.0

components:
  schemas:
    IndexItem:
      type: object
      description: Single component entry with metadata and navigation
      required:
        - name
        - type
        - path
      properties:
        name:
          type: string
          example: "webserver"
          description: Component name
        type:
          type: string
          enum: [collection, role, plugin, module, playbook]
          description: Component type
        description:
          type: string
          nullable: true
          example: "Configure web servers with nginx"
          description: Component description
        path:
          type: string
          format: path
          example: "roles/webserver"
          description: Relative path from project root
        doc_link:
          type: string
          nullable: true
          example: "./webserver/README.md"
          description: Link to generated documentation
        tags:
          type: array
          items:
            type: string
          example: ["web", "nginx"]
          description: Tags for filtering
        namespace:
          type: string
          nullable: true
          example: "my_namespace"
          description: Collection namespace
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata fields
        children:
          type: array
          items:
            $ref: '#/components/schemas/IndexItem'
          description: Child components
        dependencies:
          type: array
          items:
            type: string
          example: ["common", "utils"]
          description: Names of dependencies
        used_by:
          type: array
          items:
            type: string
          example: ["deploy_playbook"]
          description: Components that use this

    IndexPage:
      type: object
      description: Standalone index page
      required:
        - title
        - component_type
        - items
        - format
        - total_count
        - page_number
        - total_pages
      properties:
        title:
          type: string
          example: "Role Index"
          description: Page title
        component_type:
          type: string
          example: "roles"
          description: Type of components indexed
        items:
          type: array
          items:
            $ref: '#/components/schemas/IndexItem'
          description: Components on this page
        format:
          type: string
          enum: [list, table, tree, nested-table, diagram]
          description: Visualization style
        total_count:
          type: integer
          example: 150
          description: Total components across all pages
        filtered_count:
          type: integer
          nullable: true
          example: 45
          description: Count after filtering
        page_number:
          type: integer
          minimum: 1
          example: 1
          description: Current page number
        total_pages:
          type: integer
          minimum: 1
          example: 3
          description: Total number of pages
        filters_applied:
          type: array
          items:
            type: string
          example: ["tag:database", "namespace:my_namespace"]
          description: Applied filters

    SectionIndex:
      type: object
      description: Embedded index section
      required:
        - component_type
        - items
        - format
      properties:
        component_type:
          type: string
          example: "roles"
        items:
          type: array
          items:
            $ref: '#/components/schemas/IndexItem'
        format:
          type: string
          enum: [list, table, tree]
          description: Limited formats for inline use
        limit:
          type: integer
          nullable: true
          minimum: 1
          example: 10
          description: Max items to show
        show_more_link:
          type: boolean
          default: true
          description: Show link to full index
        more_link_text:
          type: string
          default: "View all {type}"
        more_link_url:
          type: string
          nullable: true
        group_by:
          type: string
          nullable: true
          enum: [type, tag, namespace]
          description: Group items by field

    IndexFilter:
      type: object
      description: Filter criteria
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          example: "tag"
          description: Field to filter on
        operator:
          type: string
          enum: [equals, contains, startswith, in]
          default: equals
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: "database"

    CrossReference:
      type: object
      description: Link between components
      required:
        - source
        - target_name
        - target_type
        - link_type
      properties:
        source:
          $ref: '#/components/schemas/IndexItem'
        target_name:
          type: string
          example: "common"
        target_type:
          type: string
          example: "role"
        link_type:
          type: string
          enum: [dependency, used_by, related, parent, child]
        resolved_path:
          type: string
          format: path
          nullable: true
        is_valid:
          type: boolean
          default: false
        validation_error:
          type: string
          nullable: true

  protocols:
    IndexGenerator:
      description: Protocol for index generation
      methods:
        generate_index_page:
          summary: Generate standalone index pages
          description: |
            Creates one or more index pages with pagination support.
            Applies filters, sorts items, and renders using specified format.
          parameters:
            - name: component_type
              in: args
              required: true
              schema:
                type: string
              description: Type of components (roles, collections, etc.)
            - name: items
              in: args
              required: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexItem'
            - name: format
              in: args
              schema:
                type: string
                enum: [list, table, tree, nested-table, diagram]
                default: list
            - name: filters
              in: args
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexFilter'
                nullable: true
            - name: page_size
              in: args
              schema:
                type: integer
                default: 50
          responses:
            success:
              description: List of index pages (one per page if paginated)
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexPage'

        generate_section_index:
          summary: Generate embedded section index
          description: Creates inline index for template markers
          parameters:
            - name: component_type
              in: args
              required: true
              schema:
                type: string
            - name: items
              in: args
              required: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexItem'
            - name: format
              in: args
              schema:
                type: string
                enum: [list, table, tree]
                default: list
            - name: limit
              in: args
              schema:
                type: integer
                nullable: true
            - name: group_by
              in: args
              schema:
                type: string
                nullable: true
          responses:
            success:
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SectionIndex'

        build_hierarchy:
          summary: Build hierarchical tree structure
          description: |
            Converts flat item list to tree structure.
            Detects circular dependencies and limits depth.
          parameters:
            - name: items
              in: args
              required: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexItem'
            - name: max_depth
              in: args
              schema:
                type: integer
                default: 5
          responses:
            success:
              description: Tree with parent-child relationships
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexItem'

        apply_filters:
          summary: Filter items by criteria
          description: Apply one or more filters with AND logic
          parameters:
            - name: items
              in: args
              required: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexItem'
            - name: filters
              in: args
              required: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexFilter'
          responses:
            success:
              description: Filtered item list
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexItem'

examples:
  basic_usage:
    summary: Generate simple role index
    code: |
      from ansibledoctor.generator.indexes import IndexGeneratorImpl
      from ansibledoctor.models.index import IndexItem
      
      # Create index generator
      generator = IndexGeneratorImpl()
      
      # Build item list from parsed roles
      items = [
          IndexItem(
              name="webserver",
              type="role",
              description="Configure web servers",
              path=Path("roles/webserver"),
              doc_link="./webserver/README.md",
              tags=["web", "nginx"],
          ),
          IndexItem(
              name="database",
              type="role",
              description="Install databases",
              path=Path("roles/database"),
              tags=["database", "postgres"],
              dependencies=["common"],
          ),
      ]
      
      # Generate index page
      pages = generator.generate_index_page(
          component_type="roles",
          items=items,
          format="list",
      )
      
      # Render to Markdown
      for page in pages:
          output = page.render(template_engine)
          write_file(f"roles/index-{page.page_number}.md", output)

  embedded_index:
    summary: Generate embedded section index
    code: |
      # In template rendering context
      from ansibledoctor.generator.indexes import IndexGeneratorImpl
      
      generator = IndexGeneratorImpl()
      
      # Generate section index
      section = generator.generate_section_index(
          component_type="roles",
          items=role_items,
          format="table",
          limit=10,
      )
      
      # Add to Jinja2 globals
      template_env.globals['index'] = lambda type, **kwargs: (
          generator.generate_section_index(type, items, **kwargs)
      )
      
      # Use in template:
      # {{ index('roles', format='table', limit=10) }}

  with_filtering:
    summary: Filter index by tag
    code: |
      from ansibledoctor.models.index import IndexFilter
      
      # Parse filter from CLI
      filters = [
          IndexFilter.from_string("tag:database"),
          IndexFilter.from_string("namespace:my_namespace"),
      ]
      
      # Generate filtered index
      pages = generator.generate_index_page(
          component_type="roles",
          items=all_items,
          format="table",
          filters=filters,
      )
      
      # Pages contain only filtered items
      assert all(
          "database" in item.tags
          for page in pages
          for item in page.items
      )
