name: Pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ dev, main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --upgrade pip

      - name: Install dependencies (use poetry)
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run pre-commit hooks
        id: precommit
        run: |
          poetry run pre-commit run --all-files > precommit-output.txt 2>&1 || true
          cat precommit-output.txt

      - name: Parse pre-commit results
        if: always()
        run: |
          python scripts/parse_precommit_results.py precommit-output.txt > precommit-metrics.json
          cat precommit-metrics.json

      - name: Upload pre-commit metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precommit-metrics
          path: precommit-metrics.json
          retention-days: 7

      - name: Check if pre-commit passed
        if: always()
        run: |
          if grep -q "Failed" precommit-output.txt; then
            echo "Pre-commit hooks failed"
            exit 1
          fi
