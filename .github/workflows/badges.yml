name: Update Badges

on:
  workflow_run:
    workflows: ["Pre-commit", "CI - Windows"]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

jobs:
  update-badges:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      
      - name: Install dependencies
        run: |
          poetry install --with dev
      
      - name: Download artifacts from triggering workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Run tests with coverage (fallback)
        if: github.event_name == 'workflow_dispatch'
        run: |
          poetry run pytest tests/ \
            --cov=ansibledoctor \
            --cov-report=term \
            --cov-report=json:coverage.json \
            --junitxml=pytest-results.xml
      
      - name: Find performance results
        id: find-perf
        run: |
          # Try to find performance-results.json from artifacts first
          if [ -f "artifacts/pytest-results-3.13/performance-results.json" ]; then
            echo "perf_path=artifacts/pytest-results-3.13/performance-results.json" >> $GITHUB_OUTPUT
            echo "Found performance results from artifacts"
          elif [ -f "performance-results.json" ]; then
            echo "perf_path=performance-results.json" >> $GITHUB_OUTPUT
            echo "Using fallback performance results"
          else
            echo "perf_path=" >> $GITHUB_OUTPUT
            echo "No performance results found"
          fi
        shell: bash
      
      - name: Run pre-commit for metrics (fallback)
        if: github.event_name == 'workflow_dispatch'
        run: |
          poetry run pre-commit run --all-files > precommit-output.txt 2>&1 || true
          python scripts/parse_precommit_results.py precommit-output.txt > precommit-metrics.json
      
      - name: Generate badge JSONs
        run: |
          mkdir -p badges
          
          # Build arguments for badge generation
          ARGS="--pyproject pyproject.toml --output badges/"
          
          # Add coverage if available
          if [ -f "coverage.json" ]; then
            ARGS="$ARGS --coverage coverage.json"
          elif [ -f "artifacts/coverage-3.13/coverage-3.13.json" ]; then
            ARGS="$ARGS --coverage artifacts/coverage-3.13/coverage-3.13.json"
          fi
          
          # Add precommit metrics if available
          if [ -f "precommit-metrics.json" ]; then
            ARGS="$ARGS --precommit precommit-metrics.json"
          fi
          
          # Add performance results if available
          if [ -n "${{ steps.find-perf.outputs.perf_path }}" ]; then
            ARGS="$ARGS --performance ${{ steps.find-perf.outputs.perf_path }}"
          fi
          
          python scripts/generate_badge_metrics.py $ARGS
        shell: bash
      
      - name: Display generated badges
        run: |
          echo "Generated badge files:"
          ls -la badges/
          echo ""
          echo "Badge contents:"
          for file in badges/*.json; do
            echo "=== $file ==="
            cat "$file"
            echo ""
          done
      
      - name: Update Gist with badges
        if: env.GIST_TOKEN != '' && env.BADGE_GIST_ID != ''
        uses: exuanbo/actions-deploy-gist@v1
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BADGE_GIST_ID: ${{ secrets.BADGE_GIST_ID }}
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.BADGE_GIST_ID }}
          file_path: badges/*.json
      
      - name: Upload badges as artifacts (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: badge-metrics
          path: badges/*.json
          retention-days: 90
