name: CI - Windows

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies (use poetry)
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Install package in editable mode
        run: |
          python -m pip install -e .

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ --cov=ansibledoctor --cov-report=term --cov-report=json:coverage-${{ matrix.python-version }}.json --junitxml=pytest-${{ matrix.python-version }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.json
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.xml
            tests/tmp/performance-results.json
          retention-days: 7

      - name: CLI smoke test
        run: |
          poetry run ansible-doctor-enhanced --help
